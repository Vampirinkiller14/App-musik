<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metrónomo Pro</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #121214;
            color: #e1e1e6;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            background-color: #202024;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            width: 85%;
            max-width: 360px;
        }
        h1 { margin: 0 0 10px 0; color: #00b37e; font-size: 1.6rem; }
        
        /* Controles de Compás */
        .time-signature {
            margin-bottom: 20px;
        }
        select {
            background: #121214;
            color: white;
            border: 1px solid #29292e;
            padding: 8px 15px;
            border-radius: 8px;
            font-size: 1rem;
        }

        /* Pantalla de BPM y botones +/- */
        .bpm-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin: 20px 0;
        }
        .btn-tempo {
            background: #29292e;
            color: white;
            border: none;
            width: 50px;
            height: 50px;
            font-size: 1.5rem;
            border-radius: 50%;
            cursor: pointer;
        }
        .btn-tempo:active { background: #00b37e; }
        .bpm-display { font-size: 4.5rem; font-weight: bold; color: #ffffff; min-width: 120px; }
        
        .slider { width: 100%; margin: 20px 0; accent-color: #00b37e; }
        
        /* Botón Principal */
        .btn-main {
            background-color: #00b37e;
            color: white;
            border: none;
            padding: 18px;
            width: 100%;
            font-size: 1.4rem;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
            box-shadow: 0 4px 12px rgba(0, 179, 126, 0.3);
        }
        .btn-main.playing { background-color: #f75a68; box-shadow: 0 4px 12px rgba(247, 90, 104, 0.3); }
        
        /* Visualizador de ritmo */
        .visualizer {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 25px;
            height: 15px;
        }
        .dot {
            width: 15px;
            height: 15px;
            background-color: #29292e;
            border-radius: 50%;
            transition: background 0.1s;
        }
        .dot.active { background-color: #00b37e; transform: scale(1.2); }
        .dot.accent { background-color: #ffcd1e; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Metrónomo Pro</h1>
        
        <div class="time-signature">
            <label for="beatsSelect">Compás: </label>
            <select id="beatsSelect">
                <option value="4">4 / 4</option>
                <option value="3">3 / 4</option>
                <option value="2">2 / 4</option>
                <option value="6">6 / 8</option>
            </select>
        </div>

        <div class="bpm-controls">
            <button class="btn-tempo" id="minusBtn">-</button>
            <div class="bpm-display" id="bpmValue">120</div>
            <button class="btn-tempo" id="plusBtn">+</button>
        </div>
        
        <input type="range" min="40" max="250" value="120" class="slider" id="bpmSlider">
        
        <button class="btn-main" id="playBtn">Comenzar</button>

        <div class="visualizer" id="visualizer"></div>
    </div>

    <script>
        let audioCtx = null;
        let isPlaying = false;
        let expected = 0;
        let timeoutId = null;
        
        let bpm = 120;
        let beatsPerMeasure = 4;
        let currentBeat = 0;

        const bpmSlider = document.getElementById('bpmSlider');
        const bpmValue = document.getElementById('bpmValue');
        const playBtn = document.getElementById('playBtn');
        const plusBtn = document.getElementById('plusBtn');
        const minusBtn = document.getElementById('minusBtn');
        const beatsSelect = document.getElementById('beatsSelect');
        const visualizer = document.getElementById('visualizer');

        // Crear los puntitos visuales según el compás
        function createVisuals() {
            visualizer.innerHTML = '';
            for (let i = 0; i < beatsPerMeasure; i++) {
                let dot = document.createElement('div');
                dot.classList.add('dot');
                visualizer.appendChild(dot);
            }
        }
        createVisuals();

        function updateBpm(value) {
            bpm = Math.max(40, Math.min(250, value)); // Límites
            bpmSlider.value = bpm;
            bpmValue.textContent = bpm;
        }

        // Eventos de control de velocidad
        bpmSlider.addEventListener('input', (e) => updateBpm(e.target.value));
        plusBtn.addEventListener('click', () => updateBpm(parseInt(bpm) + 1));
        minusBtn.addEventListener('click', () => updateBpm(parseInt(bpm) - 1));
        
        beatsSelect.addEventListener('change', (e) => {
            beatsPerMeasure = parseInt(e.target.value);
            createVisuals();
            currentBeat = 0;
        });

        // El motor del sonido (Genera el Clic)
        function playClick(isAccent) {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            // Si es el primer tiempo, suena más agudo (Acento estilo SoundCorset)
            osc.frequency.value = isAccent ? 1200 : 800; 
            
            gain.gain.setValueAtTime(isAccent ? 0.8 : 0.4, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.04);
            
            osc.start(audioCtx.currentTime);
            osc.stop(audioCtx.currentTime + 0.04);
        }

        // Bucle ultra-preciso para que no se desfase
        function scheduler() {
            while (audioCtx && audioCtx.currentTime >= expected - 0.02) {
                let isAccent = (currentBeat === 0);
                playClick(isAccent);
                
                // Actualizar luces
                const dots = visualizer.children;
                if(dots.length > 0) {
                    for(let i=0; i<dots.length; i++) dots[i].className = 'dot';
                    dots[currentBeat].classList.add('active');
                    if(currentBeat === 0) dots[currentBeat].classList.add('accent');
                }

                // Avanzar tiempo
                let interval = 60.0 / bpm;
                if (beatsPerMeasure === 6) interval = 30.0 / bpm; // Ajuste rápido para 6/8
                expected += interval;
                currentBeat = (currentBeat + 1) % beatsPerMeasure;
            }
            timeoutId = setTimeout(scheduler, 25);
        }

        function start() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            isPlaying = true;
            playBtn.textContent = 'Detener';
            playBtn.classList.add('playing');
            currentBeat = 0;
            expected = audioCtx.currentTime + 0.05;
            scheduler();
        }

        function stop() {
            isPlaying = false;
            playBtn.textContent = 'Comenzar';
            playBtn.classList.remove('playing');
            clearTimeout(timeoutId);
            // Apagar luces al frenar
            const dots = visualizer.children;
            for(let i=0; i<dots.length; i++) dots[i].className = 'dot';
        }

        playBtn.addEventListener('click', () => {
            if (isPlaying) stop(); else start();
        });
    </script>
</body>
</html>
